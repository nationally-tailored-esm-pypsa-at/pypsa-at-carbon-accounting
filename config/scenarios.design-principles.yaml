# Scenarios for config/config.design-principles.yaml, see
# docs-ca/explanations/design-principle-effects-spec.md. Each DP run differs
# from DP_base in one principle only; all use technology-based accounting.

DP_base:
  description: Full PyPSA-AT at AT35DE5 (AT at NUTS3), technology-based carbon accounting

DP1_no_national_data:
  description: DP_base without country-specific data (P1) - no KLIEN potential caps, PyPSA-Eur onwind brownfield
  mods:
    klien_potential_limits:
      technologies: []
    carbon_accounting:
      onwind_brownfield:
        enable: false

DP2_at10:
  description: DP_base at AT10DE5 (AT at NUTS2) - coarser spatial granularity (P2)
  clustering:
    administrative:
      AT: 2
  mods:
    modify_nuts3_shapes: AT10DE5

DP3_no_national_policy:
  description: DP_base without national AT policy constraints (P3) - no AT CO2 budget, EAG and electrolysis targets, net-zero electricity
  mods:
    net_zero_electricity:
      enable: false
  solving:
    constraints:
      co2_budget_national:
        # null (empty): no national CO2 budget for AT, DE unchanged
        AT:
      limits_volume_min:
        solar:
          AT:
            2030: 0
        wind:
          AT:
            2030: 0
        hydro:
          AT:
            2030: 0
        biomass:
          AT:
            2030: 0
      limits_capacity_min:
        Link:
          H2 Electrolysis:
            AT:
              2030: 0
              2040: 0
              2050: 0

DP3a_with_national_policy_no_klien:
  description: DP3_with_national_policy without KLIEN potential caps - acts as a basis for comparison with DP3a_no_national_policy_no_klien (P3); onwind brownfield unchanged
  mods:
    klien_potential_limits:
      technologies: []


DP3a_no_national_policy_no_klien:
  description: DP3_no_national_policy without KLIEN potential caps - tests whether the KLIEN caps mask the policy effect (P3); onwind brownfield unchanged
  mods:
    klien_potential_limits:
      technologies: []
  solving:
    constraints:
      co2_budget_national:
        # null (empty): no national CO2 budget for AT, DE unchanged
        AT:
      limits_volume_min:
        solar:
          AT:
            2030: 0
        wind:
          AT:
            2030: 0
        hydro:
          AT:
            2030: 0
        biomass:
          AT:
            2030: 0
      limits_capacity_min:
        Link:
          H2 Electrolysis:
            AT:
              2030: 0
              2040: 0
              2050: 0
