# Scenarios for config/config.design-principles.yaml, see
# docs-ca/explanations/design-principle-effects-spec.md. Each DP run differs
# from DP_base in one principle only; all use technology-based accounting.

DP_base:
  description: Full PyPSA-AT at AT35DE5 (AT at NUTS3), technology-based carbon accounting

DP1_no_national_data:
  description: DP_base without country-specific data (P1) - no KLIEN potential caps, PyPSA-Eur onwind brownfield
  mods:
    klien_potential_limits:
      technologies: []
    carbon_accounting:
      onwind_brownfield:
        enable: false

DP2_at10:
  description: DP_base at AT10DE5 (AT at NUTS2) - coarser spatial granularity (P2)
  clustering:
    administrative:
      AT: 2
  mods:
    modify_nuts3_shapes: AT10DE5

# P3 pair: both runs use the KLIEN technical potentials, because the KLIEN scenario
# potentials (climate scenario, year, ambition) carry national policy assumptions
# themselves and would mask the policy effect. Switch the basis for both runs at once
# via mods.klien_potential_limits.use_technical_potentials (false: scenario potentials
# as in DP_base). KLIEN onwind brownfield and all other settings stay as in DP_base.
# DP3_no_national_policy is compared with DP3_with_national_policy, not with DP_base.
# DP3_no_national_policy also drops the constraints on cross-border flows and
# infrastructure (see docs-ca/explanations/design-principle-effects-spec.md).
DP3_with_national_policy:
  description: DP_base with KLIEN technical potentials instead of scenario potentials - basis for comparison with DP3_no_national_policy (P3)
  mods:
    klien_potential_limits:
      use_technical_potentials: true

DP3_no_national_policy:
  description: DP3_with_national_policy without national AT policy constraints (P3) - no AT CO2 budget, EAG and electrolysis targets, net-zero electricity, and no cross-border flow and infrastructure constraints (NTC limits and floors, DE electricity import limit, TYNDP H2 imports, frozen gas grid)
  mods:
    klien_potential_limits:
      use_technical_potentials: true
    net_zero_electricity:
      enable: false
    # no TYNDP NTC net-flow limits and no NTC capacity floors on cross-border lines/links
    tyndp_cross_border_flow_limits:
      enable: false
    tyndp_lower_bounds:
      enable: false
    # a threshold year before the first planning horizon skips fix_gas_grid_capacity and
    # restore_asymmetric_pipeline_capacities in all horizons: gas pipelines (also AT and
    # border corridors) and new gas pipeline candidates stay extendable and may be
    # retrofitted to H2 without the AGGM target capacity
    threshold_year_for_gas_grid_expansion: 2020
  sector:
    imports:
      # no TYNDP H2 import generators (fixed p_nom, e_sum_max); the upstream price-based
      # import options stay
      carriers_tyndp: []
  solving:
    constraints:
      co2_budget_national:
        # null (empty): no national CO2 budget for AT, DE unchanged
        AT:
      # DE net electricity import limit (TWh/a): non-binding, so the cross-border flow is
      # free (the constraint stays in the network, a null would break the loop over DE)
      limits_volume_max:
        electricity_import:
          DE:
            2020: 500
            2025: 500
            2030: 500
            2035: 500
            2040: 500
            2045: 500
            2050: 500
      limits_volume_min:
        solar:
          AT:
            2030: 0
        wind:
          AT:
            2030: 0
        hydro:
          AT:
            2030: 0
        biomass:
          AT:
            2030: 0
      limits_capacity_min:
        Link:
          H2 Electrolysis:
            AT:
              2030: 0
              2040: 0
              2050: 0
