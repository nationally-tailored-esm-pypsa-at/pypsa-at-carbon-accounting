# Carbon accounting defaults. Loaded by the Snakefile after config/config.at.yaml
# and config/plotting.at.yaml, in a fenced carbon accounting block. Owned by the
# carbon accounting fork: PyPSA-AT never touches this file.

mods:
  # Carbon accounting method for national CO2 budgets, the EU CO2 cap and the
  # reported emissions. See docs-ca/explanations/carbon-accounting-spec.md
  carbon_accounting:
    enable: true
    method: technology  # technology (status quo) | carrier (green fuels book zero)
    # EUR/t CO2 on the claims of countries with a national CO2 budget (carrier
    # method only): they claim pooled credits only when their budget needs them
    claim_cost: 0.01
    # Cap the pooled oil, kerosene and methanol claims of countries with a
    # national CO2 budget at their share of the EU's fixed demand (carrier
    # method only). Off: claims are bounded by consumption only
    fair_share:
      enable: false
      tolerance: 1.0  # cap = tolerance x key x EU green production
