# Carbon accounting plotting overlay: tech_colors of the accounting layer.
# Loaded last in the config stack (see the carbon accounting block in the
# Snakefile). Owned by the carbon accounting fork.

plotting:
  tech_colors:
    # accounting layer of the carrier-based carbon accounting
    # (mods/carbon_accounting/network.py). Shades of the fuel colours.
    renewable gas attribute: '#6ab04c'
    renewable gas attribute transfer: '#6ab04c'
    renewable gas claim: '#6ab04c'
    renewable oil attribute: '#e8806b'
    renewable oil attribute distribution: '#e8806b'
    renewable oil claim: '#e8806b'
    renewable oil claim aviation: '#f2b5a8'
    renewable methanol attribute: '#c7a5d6'
    renewable methanol attribute distribution: '#c7a5d6'
    renewable methanol claim: '#c7a5d6'
    co2 import: '#999999'
